<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="field" cx="50%" cy="64%" r="78%">
      <stop offset="0%" stop-color="#1c0e07"/>
      <stop offset="48%" stop-color="#0c0705"/>
      <stop offset="100%" stop-color="#070302"/>
    </radialGradient>
    <radialGradient id="dawn" cx="50%" cy="72%" r="62%">
      <stop offset="0%" stop-color="#ff3b4e" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#7a1c22" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7a1c22" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="62%">
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0c08"/>
      <stop offset="40%" stop-color="#0a0504"/>
      <stop offset="100%" stop-color="#070302"/>
    </linearGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffba76" stop-opacity="0.85"/>
      <stop offset="32%" stop-color="#ff9a4a" stop-opacity="0.42"/>
      <stop offset="70%" stop-color="#ff3b4e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ff3b4e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="46%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#fff1de"/>
      <stop offset="20%" stop-color="#ffd470"/>
      <stop offset="46%" stop-color="#ff9a4a"/>
      <stop offset="78%" stop-color="#ff5a32"/>
      <stop offset="100%" stop-color="#ff3b4e"/>
    </radialGradient>
    <linearGradient id="loss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffba76"/>
      <stop offset="100%" stop-color="#ffd470"/>
    </linearGradient>
    <radialGradient id="ray" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffba76"/>
      <stop offset="100%" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffba76"/>
      <stop offset="100%" stop-color="#ff3b4e"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <!-- the char-black field, warmed by the dawn rising below -->
  <rect width="512" height="512" fill="url(#field)"/>
  <rect width="512" height="512" fill="url(#dawn)"/>

  
  

  <!-- the singularity: corona, light-spokes, the igniting orb -->
  <circle cx="256" cy="250" r="280.8" fill="url(#corona)"/>
  
  <g filter="url(#bloom)">
    <circle cx="256" cy="250" r="104" fill="url(#orb)"/>
    <circle cx="256" cy="250" r="104" fill="none" stroke="#ffd470" stroke-width="1.5" opacity="0.8"/>
    <circle cx="228.96" cy="214.64" r="31.2" fill="#fff1de" opacity="0.55" filter="url(#bloom)"/>
  </g>

  <!-- the dark curve of the planet, its limb rim-lit by the dawn -->
  <path d="M0 405.84 A 470 470 0 0 1 512 405.84 L512 512 L0 512 Z" fill="url(#planet)"/>
  <path d="M0 405.84 A 470 470 0 0 1 512 405.84" fill="none" stroke="url(#rim)" stroke-width="4" stroke-linecap="round" filter="url(#bloom)"/>
  <path d="M0 405.84 A 470 470 0 0 1 512 405.84" fill="none" stroke="#fff1de" stroke-width="1" opacity="0.5"/>

  <rect width="512" height="512" fill="url(#vignette)"/>
  
</svg>