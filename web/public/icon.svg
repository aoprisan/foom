e x1="438.32" y1="103.02" x2="441.38" y2="100.45" stroke="#5a2f12" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/><line x1="462.11" y1="137" x2="465.58" y2="135" stroke="#5a2f12" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/><line x1="479.65" y1="174.6" x2="483.41" y2="173.23" stroke="#5a2f12" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/><line x1="490.38" y1="214.67" x2="494.32" y2="213.98" stroke="#5a2f12" stroke-width="1.4" stroke-linecap="round" opacity="0.45"/>
